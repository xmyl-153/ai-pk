name: 门禁

# 三道门禁都不需要 API key，所以 CI 可以完全免费地跑。
# 任何 push / PR 都必须让它们全绿 —— 这是这个项目"测量装置自身要被测"的落地方式。
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    name: selfcheck + 回归测试 + 离线全链路
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 门禁 1/3 —— 任务族自检（oracle 会不会把对的判错）
        run: python -m aipk selfcheck

      - name: 门禁 2/3 —— 测量缺陷回归测试
        run: python tests/test_measurement.py

      - name: 门禁 3/3 —— 离线跑通全链路（不需要 key；满分必须 100%、错答必须 0%）
        # 干净环境：连 ~/.dsh 都没有。demo 走的是 scripted 模型，一个网关都不该需要 ——
        # 之前它其实是靠作者本机的 DSH 凭据才"绿"的，CI 上第一次跑就红（缺陷 #20）。
        env:
          HOME: /tmp/aipk-clean-home
          DSH_HOME: /tmp/aipk-clean-home/.dsh
        run: python -m aipk demo

      - name: 开源前自检 —— 确认没把密钥/隐私写进仓库
        run: python tools/secret_scan.py
